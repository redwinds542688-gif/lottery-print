<script>
/* 2026-08-31：手機/平板直向專用擋板。判定規則：
   (1)裝置：螢幕短邊(screen.width/height取小者，CSS px)<=PHONE_MAX_SHORT_SIDE 且 有觸控 → 視為手機或平板(平板短邊通常600~834，門檻設900)；電腦沒觸控或螢幕更大 → 擋掉。
      (原本只開放手機、門檻520；2026-08-31依使用者要求開放平板豎屏)
   (2)方向：視窗高<=寬 → 橫向 → 擋掉並提示轉回直向。
   開機、resize、轉向時都會重判；要暫時關閉整個擋板把PHONE_ONLY_GATE_ENABLED改成false。 */
(function(){var PHONE_ONLY_GATE_ENABLED=true;var PHONE_MAX_SHORT_SIDE=900;
function isPhoneDevice(){try{var shortSide=Math.min(screen.width||0,screen.height||0);var hasTouch=(navigator.maxTouchPoints||0)>0||(window.matchMedia&&window.matchMedia("(pointer: coarse)").matches);return hasTouch&&shortSide>0&&shortSide<=PHONE_MAX_SHORT_SIDE}catch(e){return true}}
function isPortrait(){var vv=window.visualViewport;var w=vv?vv.width:window.innerWidth;var h=vv?vv.height:window.innerHeight;return h>w}
function ensureGate(){var g=document.getElementById("phone-only-gate");if(g)return g;g=document.createElement("div");g.id="phone-only-gate";g.innerHTML='<div class="gate-icon">📱</div><div class="gate-title"></div><div class="gate-msg"></div>';(document.body||document.documentElement).appendChild(g);return g}
function check(){if(!PHONE_ONLY_GATE_ENABLED)return;var g=ensureGate();var title=g.querySelector(".gate-title"),msg=g.querySelector(".gate-msg");if(!isPhoneDevice()){title.textContent="本程式只提供手機／平板使用";msg.textContent="電腦無法使用，請改用手機或平板（直向／豎屏）開啟。";g.classList.add("show");document.documentElement.style.overflow="hidden";return}if(!isPortrait()){title.textContent="請將裝置轉回直向";msg.textContent="本程式只提供手機／平板直向（豎屏）使用，橫向時無法操作。";g.classList.add("show");document.documentElement.style.overflow="hidden";return}g.classList.remove("show");document.documentElement.style.overflow=""}
window.__phoneOnlyGateCheck=check;
if(document.body)check();else document.addEventListener("DOMContentLoaded",check);
window.addEventListener("resize",check);window.addEventListener("orientationchange",function(){setTimeout(check,150)});
if(window.visualViewport)window.visualViewport.addEventListener("resize",check);
})();
</script>

<script>
/* 開機錯誤顯示器(2026-08-30)：一啟動就卡住時按不到瓢蟲，所以把任何未捕捉的錯誤直接畫在畫面最上方，
   方便截圖回報。正常情況下不會出現。 */
(function(){var BOOT_DEBUG_ENABLED=false;/* 2026-08-31：開機偵錯(錯誤紅字/上次開機階段紅字)整組先停用；要重新啟用改成true */function show(msg){if(!BOOT_DEBUG_ENABLED)return;try{var el=document.getElementById("boot-error-box");if(!el){el=document.createElement("div");el.id="boot-error-box";el.style.cssText="position:fixed;left:0;right:0;top:0;z-index:99999;background:#b00020;color:#fff;font:13px/1.4 monospace;padding:8px;white-space:pre-wrap;word-break:break-all;max-height:45vh;overflow:auto;";(document.body||document.documentElement).appendChild(el)}el.textContent+=msg+"\n"}catch(e){}}
/* 開機階段追蹤：每個關鍵步驟寫一次localStorage，若上次沒跑到「完成」就在畫面頂端顯示卡在哪一步 */
try{var prevStage=localStorage.getItem("539app_bootStage");var prevTime=localStorage.getItem("539app_bootStageTime")||"";var prevEpoch=parseInt(localStorage.getItem("539app_bootStageEpoch")||"0",10);/* 距上次記錄不到15秒＝瀏覽器自己立刻重新載入(不是卡死)，不顯示 */var SHOW_PREV_BOOT_STAGE=false;/* 2026-08-31：紅字關閉(多為分頁被中途關掉的誤報)；階段仍記錄在localStorage 539app_bootStage *//* 2026-08-30：使用者要求拿掉「上次開機沒有完成」的紅字；階段仍寫進localStorage(539app_bootStage)供日後查看，要重新顯示改成true */if(SHOW_PREV_BOOT_STAGE&&prevStage&&prevStage!=="完成"&&(!prevEpoch||Date.now()-prevEpoch>15000)){var msgPrev="[上次開機沒有完成] 卡在：「"+prevStage+"」 時間："+prevTime;if(document.body)show(msgPrev);else document.addEventListener("DOMContentLoaded",function(){show(msgPrev)})}}catch(e){}
window.__bootStage=function(stage){/* 開機完成後就不再記錄(例如之後切換玩法重建表格時的futureSlots會再被呼叫，不能覆蓋成「未完成」) */if(window.__bootDone)return;if(stage==="完成")window.__bootDone=true;try{localStorage.setItem("539app_bootStage",stage);localStorage.setItem("539app_bootStageTime",new Date().toLocaleString());localStorage.setItem("539app_bootStageEpoch",String(Date.now()))}catch(e){}};
window.__bootStage("開頭腳本");
window.addEventListener("error",function(e){var m="[錯誤] "+(e.message||"")+" @"+(e.filename||"").split("/").pop()+":"+e.lineno+":"+e.colno;if(e.error&&e.error.stack)m+="\n"+String(e.error.stack).split("\n").slice(0,4).join("\n");if(document.body)show(m);else document.addEventListener("DOMContentLoaded",function(){show(m)})});
window.addEventListener("unhandledrejection",function(e){var r=e.reason;var m="[Promise錯誤] "+(r&&r.message?r.message:String(r));if(r&&r.stack)m+="\n"+String(r.stack).split("\n").slice(0,4).join("\n");if(document.body)show(m);else document.addEventListener("DOMContentLoaded",function(){show(m)})});
})();
</script>
<script>
/*
================================================================================
名揚四海彩卷系統 — 完整技術文件（給未來接手者/未來對話參考）
最後更新：2026-08-30
================================================================================

【一、整體架構】
四種玩法：539、六合彩(mark6)、天天樂(daily)、大樂透(lotto)
  - 539/天天樂：5個號碼一組
  - 六合彩/大樂透：6個號碼+1個特別號 = 7欄，isWideGame()判斷

四種畫面情境（重要，很多邏輯都依畫面情境分支）：
  1. 一般首頁：App剛開啟看到的縮小版首頁
  2. 抓牌首頁：雙擊「抓」進入，magnifier-mode尚未啟用，還沒選任何功能
     （3x3選單：返回首頁/儲存圖檔/個性調色/C式概率/E式概率/定期十六/C式定位/C式差數/C式合匯）
  3. C式(定/差/合)、定期十六：body加上 magnifier-mode + recent-only-mode，
     此時才是真正「可互動」的表格畫面，一二三四招才能使用
  4. 儲存輸出(印/儲存開獎單)：body加上 capturing-plain / capturing-save-only /
     capturing-clean-sheet，各自有獨立CSS規則，跟畫面上顯示的規則是分開的

【二、一二三四招 標記系統】
第一招：雙擊格子標記（pickCell函式）
第二招：手指拖曳整排標記（markCellForDrag/unmarkCellForDrag）
第三招：拖曳連線兩個已標記格子（addConnection，SVG畫線 #connect-svg）
第四招：長按「第一、二排」空白期格子，跳出選號視窗，手動指定號碼
  - 只能在「magnifier-mode 或 viewPinned(已鎖定畫面)」狀態下使用，兩者任一成立即可
    （抓牌首頁必須先雙擊鎖定畫面🔒才能用）
  - 已選號的格子再次長按，選單只會顯示同一個號碼可選（openNumPicker裡的邏輯）
  - 文字色：固定 #5E0E0E（框色九號），不受調色盤影響（.num-picked CSS規則）
  - 四個獨立儲存池：numPickedEntries(一般+定期十六共用)、
    numPickedEntriesCDing(C式-定)、numPickedEntriesCCha(C式-差)、
    numPickedEntriesCHe(C式-合)。取用邏輯見 getCurrentNumPickedArray()/
    setCurrentNumPickedArray()，四個池子各玩法(539/mark6/daily/lotto)也各自獨立保存
  - 一二三四招在「一般首頁」跟「抓牌首頁(未鎖定)」都無法使用，
    只有進入C式/定期十六，或抓牌首頁鎖定畫面後才能用

【三、C式（定/差/合）核心邏輯】
進入：雙擊「抓」→點「C式概率」→applyCModeAutoFraming()啟用，
     預設進入「定」子模式，可切換定/差/合三個子模式(switchCSubMode)
搜索期數：cModeDingSearchSpan/cModeChaSearchSpan/cModeHeSearchSpan，可設5/6/7期
16+4設定：cModeRecentRealCount=16真實期+cModeRecentBlankExtra=4空白期，共20列
（曾一度依使用者要求改為16+3=19列，後來使用者要求恢復成16+4=20列，
目前是恢復後的16+4。四個設定cModeRecentBlankExtra的地方（初始值、
定期十六按鍵、C式概率按鍵、C式定位按鍵）務必一起改，不要漏改其中一處）

上下桿（錨定列）：
  - A(上桿)=cModeAPeriod、B(下桿)=cModeBPeriod，範圍見clampCModePeriods()
  - 拖曳桿鍵：#c-mode-a-handle / #c-mode-b-handle，用createElementNS建立SVG
    (↕箭頭圖示，避免innerHTML解析SVG的邊緣案例問題)，觸摸拖曳可移動A/B期數
  - 錨定列顯示邏輯全部在 renderCModeOverlayForRow(container,tr) 函式：
    * 整排底色固定用「拖曳色」(--mark-predict-color)
    * 文字色固定 #1F1F1F（線色9號，寫死，不受調色盤影響），
      但num-picked格子文字色改用框色九號規則(交給.num-picked CSS處理，不在這裡設)
    * 外框：改用box-shadow（不是border！因為border-collapse表格容易在格子交界
      處斷開對不齊），四邊用inset box-shadow精確對齊，顏色固定用「線色」
      (--mark-line-color)。box-shadow每次都要完整覆蓋，清除時
      clearCModeCellColors()/forceCleanAllCModeMatchCellStyles()都要記得
      一併清 box-shadow，否則拖曳桿移動後容易殘留造成「格線變大」
    * 重要：c-mode-auto-match-cell(相等比對命中格)的底色/文字色會被跳過
      （交給其他函式處理），但box-shadow邊框「不能跳過」，要對全部5/6格
      都套用，否則邊框會在該格斷開出現缺口

【一般首頁取消.scroller黑色邊框】.scroller這個容器包住下方完整的
開獎歷史表格(#panels)，原本CSS有border:1.5px solid #000的黑色外框，
使用者反映在一般首頁最新開獎區下方看到一小段黑線顯示不對，要求取消。
修法：把.scroller基礎CSS規則的border改成none(其餘border-radius維持
不動)。後面還有幾條針對.scroller的border-width/border-color覆蓋規則
(border-radius:0、border-width:0.9px、border-color:#e02020、
border-color:#000)，這些都只設定border-width或border-color，沒有
設定border-style，只要基礎規則的border-style維持在none，這些覆蓋規則
就不會讓邊框重新顯示出來(CSS裡border-style為none時，border-width/
border-color設什麼都不會畫出線)，不需要逐一去改那幾條覆蓋規則。

【開獎單上緣被切到、跟紅框區銜接不乾淨】.scroller(包住開獎單表格的
容器)原本跟上面.hero紅框區(最新開獎那個紅色2px邊框的區塊)是margin:0
零間距貼在一起，上緣看起來像被切到、跟紅框區重疊或銜接不乾淨。修法：
.scroller的margin改成"6px 0.5% 0"，加一點margin-top，讓開獎單表格
整體往下移一點點，跟紅框區之間留出乾淨的間距，看起來是無縫、乾淨的
上下排列，不是重疊/切到的樣子。

【開獎單上緣margin-top修正的副作用-抓牌全螢幕多了白線】上面
「開獎單上緣被切到」那條修正(.scroller加margin-top:6px)是套在
.scroller的基礎規則上，沒有限定情境，導致「抓牌」全螢幕畫面(magnifier-
mode，還沒進入定期十六/C式的recent-only-mode之前)也被加上這6px的
上邊距——但這個畫面裡.scroller上面沒有.hero紅框區(進magnifier-mode
後.hero會display:none)，原本是直接貼齊上面的分頁按鍵列，加了
margin-top後多出一段跟背景色不一致的縫隙，使用者看到就像多了兩條
白線。
修法：新增body.magnifier-mode .scroller{margin-top:0;}，只要進入
magnifier-mode(抓牌全螢幕、定期十六、C式都算)，一律把margin-top蓋回0，
讓這個6px的上邊距只在「一般首頁」(不在magnifier-mode時)才生效，其他
全螢幕情境維持原本零間距貼齊的樣子。

【抓牌首頁未鎖定畫面的白線真正來源】前面幾輪先後拿掉了.scroller的
margin-top、又隱藏了.hint-bar本身，但使用者反映白線還在。往回查才發現
還有一個獨立元素#hint-bar-bg-wrap，是JS(applyImgHintBarConnect())算好
位置後蓋在.hint-bar後面的一塊「fixed定位背景層」(background:#e9e9e9灰
色，但在深色狀態列/淺色開獎單之間看起來就像一條白/灰線)，CSS裡寫死
body.magnifier-mode #hint-bar-bg-wrap{display:block}，也就是只要進入
magnifier-mode(不管有沒有進一步到recent-only-mode)這個背景層就會顯示，
之前只隱藏了.hint-bar本身，沒有連這個背景層一起隱藏，線才會一直沒消失。
修法：新增body.magnifier-mode:not(.recent-only-mode) #hint-bar-bg-wrap
{display:none!important}，用not(.recent-only-mode)+!important的組合、
比原本body.magnifier-mode #hint-bar-bg-wrap{display:block}選擇器更精確
更高優先權，蓋掉它，讓「抓牌首頁未鎖定」這個畫面狀態下#hint-bar-bg-wrap
也確實被隱藏。recent-only-mode(定期十六/C式)原本就已經有獨立規則隱藏
它，不受影響。

【抓牌首頁未鎖定畫面白線-第三輪：兩塊灰色背景層接縫】使用者截圖比對後
發現線還在，仔細看是夾在兩塊灰色區塊「中間」的一條細白線，不是灰色
區塊本身缺席。往回查發現實際上有「兩塊」各自獨立定位的灰色背景層：
#header-top-bg-wrap(蓋在分頁按鍵列後面，高度由裡面重新掛載的
header.top內容自然撐開，沒有額外用JS指定height)，跟
#hint-bar-bg-wrap(蓋在提示文字列後面，top/height是
applyImgHintBarConnect()依#hero目前的getBoundingClientRect()算出來的
——#hero在magnifier-mode底下用的是visibility:hidden不是display:none，
所以它仍佔著版面空間，getBoundingClientRect()量得到有效的top/height，
只是視覺上看不見)。這兩塊背景各自獨立計算位置，中間如果有一點點算法
上的誤差(哪怕只有1~2px)，銜接處就會露出一絲白色，形成使用者看到的
細白線。
修法：applyImgHintBarConnect()裡，#hint-bar-bg-wrap的top改成
「往上多推2px」(Math.round(heroRect.top)-2)、height對應「多加2px」
(維持底部位置不變)，讓它主動往上跟#header-top-bg-wrap重疊一點點，
不管兩者計算誤差多小，接縫處都會被蓋住，不會再露出縫隙。

【抓牌首頁未鎖定：上下白線框住、開獎單完整縮放顯示】新增需求：
在畫面最上面(打叉按鍵下方，原本就有的hint-bar-bg-wrap區域)跟最下面
(漂浮按鍵上方，新增#bottom-frame-line-wrap這個元素)各畫一條白線當
邊界標記，兩條線中間的區域，要把「整張開獎單」(所有期數，不是只有最近
16+4期)不管拉伸還是縮小，完整塞進去，不留白也不需要捲動——這是開獎單
的「最小顯示狀態」，之後使用者手勢縮放，都是從這個already-fit-好的
基準狀態繼續放大。

實作：
1. 新增#bottom-frame-line-wrap元素跟CSS，樣式比照既有的
   #hint-bar-bg-wrap，只在body.magnifier-mode:not(.recent-only-mode)
   (也就是「抓牌首頁未鎖定」)這個狀態顯示。
2. 新增fitFullSheetToFrame()函式：
   - 定位#bottom-frame-line-wrap的top，緊貼在漂浮按鍵列(用跟
     positionPinOnScreen()一樣的算法算出漂浮按鍵的rowTop)正上方。
   - 量出「上邊界」(hint-bar-bg-wrap的底部，也就是既有的那條白線
     所在位置)到「下邊界」(新的bottom-frame-line-wrap)之間的可用高度。
   - 把panels.style.transform重設成"none"量出整張開獎單(全部期數)
     的自然寬高，算出scaleX(可用寬度/自然寬度)、scaleY(可用高度/
     自然高度)，用panels.style.transform="scale(scaleX, scaleY)"
     (非等比例拉伸，跟applyRecentOnly()同一套手法)硬塞滿整個可用區域。
   - scrollerEl改成fixed定位，寬高精確對齊可用區域、overflow:hidden，
     確保不會超出上下白線範圍、也不會留白。
3. showFullPageImage()(進入「抓牌首頁未鎖定」的進入點函式)最後加兩層
   requestAnimationFrame，等版面穩定後呼叫fitFullSheetToFrame()。

【後續修正-position:fixed跟手勢縮放衝突】原本fitFullSheetToFrame()
把scrollerEl設成position:fixed直接定位在螢幕座標——但scrollerEl其實是
#page-zoom-wrap的子元素，而使用者手勢縮放(pinch-zoom)是靠
applyPageZoom()對#page-zoom-wrap套用CSS transform:scale(pageZoom)
做到的。CSS規定：只要祖先元素有transform，裡面所有position:fixed的
子元素就會改成「相對那個祖先」定位，不再是相對整個瀏覽器視窗——這代表
只要使用者一開始手勢縮放(pageZoom不等於1，transform生效)，
scrollerEl的fixed定位就會整個跑掉、不再乖乖貼著算好的上下白線位置。
修法：scrollerEl不用position:fixed，改回一般文件流(position留空、
只設定width/height/margin)，讓它自然跟著#page-zoom-wrap的transform
一起被正確縮放跟定位，不會在手勢縮放後跑版。這樣一來，「最小狀態→
手勢放大」這件事，數學上就是#page-zoom-wrap的transform(pageZoom)
疊加在panels自己的transform(fitFullSheetToFrame算出來的scaleX/scaleY)
上面，兩層transform相乘，效果正是使用者要的「從完整顯示的最小狀態
繼續放大」。

【後續修正-pageZoom縮放疊加問題】使用者強調上下白線是「螢幕的絕對
位置」，回頭檢查發現一個關鍵問題：scrollerEl其實包在#page-zoom-wrap
裡面，這個外層容器本身就會套用transform:scale(pageZoom)(使用者手勢
縮放用的)。fitFullSheetToFrame()是用visualViewport量出的「螢幕絕對
座標」去反推scrollerEl該設多寬多高，但如果進入抓牌畫面當下pageZoom
剛好不是1(例如之前操作有留下縮放值)，設定的width/height套到
scrollerEl上以後，還會再被外層#page-zoom-wrap的scale(pageZoom)乘一次，
實際渲染出來的大小就會跟「螢幕絕對座標」算出來的目標對不起來(通常會
偏大，也就是超出下面白線)。
修法：fitFullSheetToFrame()一進來就先強制把pageZoom重設回1並呼叫
applyPageZoom()，確保後面所有拿screen絕對座標算出來的width/height，
套到scrollerEl上之後，因為外層此刻scale(1)＝不縮放，渲染大小會直接
1:1對應到目標的絕對位置，不會再被多乘一層。

pageZoom重設)都沒解決問題，使用者截圖顯示表格還是明顯超出下面的白線，
用程式碼推理已經連續猜錯三次。與其繼續憑猜，改在fitFullSheetToFrame()
的每個關鍵步驟插入logEvent()除錯記錄：有沒有被magnifier-mode/
recent-only-mode擋掉提早return、pageZoom有沒有被重設、算出來的
viewportW/H、topBound/bottomBound/availableHeight、panels的
naturalW/naturalH、最後的scaleX/scaleY、套用完後scrollerEl實際的
getBoundingClientRect()。下次使用者按瓢蟲抓記錄，就能直接從記錄裡
看到問題卡在哪一步(是完全沒執行到、還是算出來的數字本身就不對)，
再對症下藥，不要再連續憑程式碼推理去猜。

【真正根源找到了-activateFloatingButtons()漏掉body.magnifier-mode】
使用者提供的瓢蟲除錯記錄裡，從頭到尾沒有出現任何一筆「fit除錯」記錄，

(我之前的hook全部加在錯的函式上)。而且更關鍵的是：全程式碼裡
document.body.classList.add("magnifier-mode")只出現在

從頭到尾都沒有幫body加上magnifier-mode這個class！這代表「抓牌首頁未
鎖定」這個畫面狀態下，body.magnifier-mode永遠是false——不只
fitFullSheetToFrame()的第一行判斷式會直接return，前幾輪修的所有
「body.magnifier-mode ...」開頭的CSS規則(白線相關的.scroller
margin-top:0、#hint-bar-bg-wrap隱藏規則等)在這個畫面裡也統統沒機會

document.body.classList.add("magnifier-mode")，並且在函式最後補上
跟showFullPageImage()一樣的兩層requestAnimationFrame
+350ms延遲呼叫fitFullSheetToFrame()。closeBtn的關閉處理本來就已經有
document.body.classList.remove("magnifier-mode")，離開時的清除不受

magnifier-mode)雖然讓fitFullSheetToFrame()真的執行了，但使用者截圖
發現畫面最上面的分頁按鍵/關閉鍵整個消失變空白——因為magnifier-mode這個
class在其他大量既有CSS規則裡是「定期十六/C式」全螢幕版面專用的信號，

既有規則)：
  1. activateFloatingButtons()(「抓牌首頁未鎖定」真正的進入函式)加上

     document.body.classList.contains("catch-card-fit-mode")，不再

     (activatePeriodMode())，都要記得把catch-card-fit-mode拿掉——

     短暫經過activateFloatingButtons()(設置catch-card-fit-mode)，
     再呼叫activatePeriodMode()，如果不清掉，會在C式/定期十六模式下

【命名慣例】「定」子模式裡其實有兩套獨立的比對邏輯，同時跑、各自標記、各自畫線：
  1. 定位號碼：runCModeDingSearch() 找到的號碼。上桿(A)/下桿(B)兩軌同樣往前推
     第k期、同一欄位，號碼「完全相同」就命中，標記class為c-mode-auto-match-cell，
     連線用 c-mode-ding-lines-svg（直線）+ c-mode-ding-arcs-svg（弧線）
  2. 標定號碼：renderCModeDingAutoDragDesignation() 找到的號碼。只鎖定下桿(B)錨定列
     自己的號碼算九宮拖牌，往前期找同欄位是否有九宮候選數字，標記class為
     c-mode-cha-drag-designated，連線用 c-mode-ding-auto-drag-lines-svg
  【優先權規則】定位號碼不管落在哪裡，一定照定位號碼的畫法顯示；標定號碼不管落在
  哪裡，也一定照標定號碼自己「統一的」畫法顯示（不論是否落在上下桿錨定列上，畫法
  都一樣，沒有例外）——唯獨兩者「同一格重疊」時例外：此時定位號碼優先，標定號碼
  的畫法不套用上去。
  實作：markDingAutoDragCell() 一開頭就檢查該格是否已經是c-mode-auto-match-cell
  (定位號碼)，若是則直接return、不套用標定號碼的class/樣式，保留定位號碼原本的畫法
  （連線本身仍會畫到該格，只是格子的標記樣式不變）。
  此優先權能生效是因為呼叫順序固定：runCurrentCSubModeSearch()裡一定是先跑
  runCModeDingSearch()（定位號碼），cSubMode==="定"時才接著跑
  renderCModeDingAutoDragDesignation()（標定號碼），修改或重構時務必維持此順序。

九宮拖牌標定（僅「定」子模式）：renderCModeDingAutoDragDesignation()，
  下桿錨定列5個號碼各自套九宮偏移(-11,-10,-9,-1,0,+1,+9,+10,+11，可勾選)，
  在下桿自己的歷史期數搜尋比對，命中格用markDingAutoDragCell()上色：
  圓圈填色用框色、外框用底色，文字用字色(綠)——不管命中格是否剛好落在
  上下桿錨定列上，畫法統一，不因位置而有例外（已移除舊版的on-anchor
  特例：舊版會把落在錨定列上的標定號碼借用定位號碼的圓圈配色(框改藍底紅框)
  並把文字強制改黑色#1F1F1F，這跟「標定號碼不管落在哪裡都要照標定號碼畫法」
  的規則衝突，故拿掉，c-mode-ding-drag-on-anchor這個class保留在CSS但JS已
  不再加上它）
  【底色例外】唯一跟位置有關的是td本身的background（不是圓圈畫法本身）：
  CSS的.c-mode-cha-drag-designated{background:transparent!important}
  是給「不在錨定列上」的格子用的，讓周圍格子的白底透出來，圓圈疊在上面。
  但若命中格剛好落在上下桿錨定列上，該列本身應該整排都是錨定列的拖曳色
  (--mark-predict-color黃色，由renderCModeOverlayForRow整排上色)，此時
  markDingAutoDragCell()要改用inline style把background設回
  --mark-predict-color（而不是removeProperty），才不會讓格子露出白色，
  跟同一排其他格子的黃底不一致。判斷方式跟c-mode-ding-drag-on-anchor
  以前的判斷一樣：tdTr===bAnchorRow或aAnchorRow。這一步只影響底色，
  圓圈(::before)、文字顏色仍然照標定號碼原本統一的畫法，不受影響。

的cell/SVG元素，會自然地什麼都不做、安全略過，不會出錯，也不需要另外
寫條件排除。這樣設計的好處是：以後不管新增/修改哪個「定期十六/C式」
畫面的存檔行為，只要改wasRecentOnlyMode這個分支，就能同時套用到所有
子模式，不用四個地方分別維護、容易漏改。

定期十六/C式截圖存檔：saveAsImage()裡wasRecentOnlyMode分支原本呼叫
triggerPngDownload()，第三參數skipPaperFit傳true，代表跳過
triggerPngDownload()裡「置中貼到A3/A4紙張畫布」那段邏輯，直接下載
html2canvas截出來、緊貼內容邊緣的小張canvas(沒有置中、也沒有滿版)。
中間試過改呼叫composePaperCanvas()+downloadComposedCanvas()、
fitMode="stretch"拉伸貼滿A3/A4紙張畫布，但A3/A4是印刷紙張的長寬比
(約1:1.414)，跟手機螢幕的長寬比(通常細長很多，例如1:2點多)差異很大，
硬拉伸貼滿A3/A4會讓內容變形得很嚴重(圓圈變橢圓、文字被壓扁)，觀感很差，
使用者確認不能接受。
最終正確做法：目標畫布的寬高比例不用A3/A4，改用「使用者手機螢幕當下的
viewport寬高比例」(window.visualViewport.width/height，取不到則退回
window.innerWidth/innerHeight)，乘上captureScale(3)當作實際輸出解析度。
這個比例、這個拉伸手法，其實跟畫面「現場顯示」時applyRecentOnly()裡
用CSS transform:scale(scaleX,scaleY)把panels自然尺寸拉伸滿螢幕的算法
完全一樣(scaleX=螢幕寬/內容原始寬、scaleY=螢幕高/內容原始高)，只是這裡
改用canvas的drawImage()重現同一組拉伸比例，而不是重新算一個跟畫面顯示
無關的紙張比例。這樣存出來的圖，觀感才會跟使用者實際在畫面上看到的
「定期十六/C式滿屏顯示」一致，不會有明顯的額外變形感。
（之所以先前html2canvas截圖時要把panels.style.transform重設成"none"
再用「自然尺寸」去截：這是因為html2canvas本身對CSS transform:scale()
的渲染支援不穩定，所以策略是「先截自然尺寸的乾淨圖」，「拉伸滿版這件事
留到後面用canvas API做」，避開html2canvas處理transform的已知問題。）
triggerPngDownload()、composePaperCanvas()本身仍保留在程式碼裡
（給其他還在用A3/A4紙張輸出的地方，例如「儲存開獎單」用），只是定期
十六/C式這條路徑已經改道走viewport比例，不再呼叫它們。

定期十六/C式截圖存檔「沒有線」的問題：C式的各種連線
(c-mode-arc-svg上下桿指標線、c-mode-ding-lines-svg/c-mode-ding-arcs-svg
定位號碼連線、c-mode-ding-auto-drag-lines-svg標定號碼連線)全部是獨立
掛在document.body底下的position:fixed SVG，不是outer(scrollerEl)的
子元素，而saveAsImage()是用html2canvas(outer,...)截圖，只會截到outer
子樹範圍內的DOM，這些SVG完全不在截圖範圍內，所以畫面上看得到、截圖裡
卻沒有。修法：saveAsImage()裡新增drawFixedOverlaySvgsOntoCanvas()，
在html2canvas()截完之後，手動走訪這幾個SVG id，把每個子元素(path或line)
的路徑資料轉成Path2D，用ctx.setTransform()對齊outer的座標系統
(captureScale倍率、扣掉outerRect.left/top)後stroke上去，顏色/線寬取自
getComputedStyle()（能正確解析CSS variable如var(--mark-line-color)算出
的實際顏色），畫完後把transform reset回單位矩陣。這跟既有的
drawConnectionsOntoCanvas()(補「一二三四招」連線)是同樣的手法，只是後者
連線資料存在connections陣列裡用JS直接算座標畫，這裡改成直接讀現成SVG的
path/line屬性省得重算一次幾何。

存檔過程畫面「殘影/暗掉」的問題：截圖時會先把panels.style.transform
從on-screen的scale(scaleX,scaleY)重設成"none"讓html2canvas截「未拉伸
的原始尺寸」，這一瞬間版面會重排(reflow)，但上述那些fixed SVG連線的
座標是由各自的requestAnimationFrame迴圈(renderCModeArcLoop等)持續讀取
getBoundingClientRect()算出來的，版面剛重排的那一兩幀，SVG還沒來得及
跟著更新，畫面上就會看到線暫時「跑位」、疊在錯誤位置(殘影)。這段期間
其實已經有全螢幕的captureMask(白色、寫「處理中…」)蓋著，但captureMask
原本z-index只有1000，而這些SVG疊層的z-index高達8400~9600，導致SVG
疊在captureMask「上面」蓋不住，殘影才會被使用者看到。修法：把
captureMask(saveAsImage()、saveCleanSheetImage()兩處都有各自一份)的
z-index從1000提高到99999，確保處理中的白色遮罩能蓋住所有C式浮動疊層，
使用者就不會再看到殘影，只會看到「處理中」的白色畫面直到存檔完成。

上下桿整排被誤畫上圓圈的問題：markCModeAbRows()把上下桿(A/B錨定列)整排
格子都push進pickedPaths(via:"click")，經過applyMarksToClone()後這些格子
會被加上num-marked、num-marked-click這兩個class(跟真正手動點擊的一二招
標記共用同一套class)，畫面上之所以看不到圓圈，是靠額外加的
c-mode-ab-suppress-circle這個class，配合CSS規則
「.num-marked.num-marked-click.c-mode-ab-suppress-circle::before」
把圓圈隱藏掉。但saveAsImage()裡手動把圓圈畫到截圖canvas上的
drawCircleMarksOntoCanvas()，原本只檢查td是否有num-marked-click，
沒有排除c-mode-ab-suppress-circle，導致CSS上該隱藏的圓圈，在存檔截圖
這條路徑裡因為是用canvas API重畫、不受CSS規則管轄，整排上下桿格子都被
畫上了圓圈。修法：drawCircleMarksOntoCanvas()裡加一行判斷，td若帶有
c-mode-ab-suppress-circle就直接跳過該格，不畫圓圈，這樣存檔結果才會
跟畫面上看到的一致(上下桿本身不畫圓圈，只有真正被定位/標定邏輯命中的
格子才畫)。

上下桿紅線(c-mode-arc-svg)太粗的問題：renderCModeArcLoop()畫這兩條
紅色指標線時，stroke-width是寫死的常數"3"，不像其他C式連線(c-mode-ding-
lines-svg等)會依cellScale(目前格子寬度/NATURAL_CELL_WIDTH)動態調整粗細。
這個寫死的3，是設計給「現場畫面」用的——現場畫面的格子已經被
panels.style.transform:scale(scaleX,scaleY)放大貼滿螢幕，格子本身很大，
3px線相對格子來說很細，比例正常。但存檔截圖時，html2canvas是在
transform重設為"none"(格子縮回自然小尺寸)的狀態下擷取，這時格子可能只有
現場畫面的1/3~1/4大，同一條「3px」線相對這麼小的格子就顯得粗了一大截，
之後這張自然尺寸小圖還要再整張拉伸放大貼滿螢幕(見上面「拉伸滿版」段)，
線的粗細也跟著等比例被拉伸，兩次放大疊加下來，最終線寬變得誇張的粗。
修法：drawFixedOverlaySvgsOntoCanvas()裡新增naturalCellScale
(取畫面上任一個td.num格子在自然尺寸狀態下的實際寬度，除以
NATURAL_CELL_WIDTH=28.12這個基準值算出目前縮放比例)，只套用在
c-mode-arc-svg這個「寫死粗細」的例外身上，把stroke-width乘上
naturalCellScale等比例縮小，讓它在自然尺寸小圖裡就已經是「正確比例的細
線」，之後跟著整張圖一起等比例放大回螢幕尺寸時，粗細才會跟真實截圖
(圖一)一樣細，不會被放大到失真。其餘幾個SVG(c-mode-ding-lines-svg/
c-mode-ding-arcs-svg/c-mode-ding-auto-drag-lines-svg)本身的stroke-width
屬性在render時就已經用cellScale算過、是跟目前格子尺寸成比例的動態值，
不受這個問題影響，維持原樣不做額外縮放。

定位/標定號碼「文字沒有在圈圈裡面、圈圈只畫出一半」的問題：定位號碼
(c-mode-auto-match-cell)、標定號碼(c-mode-cha-drag-designated)的圓圈
畫法，全部是靠CSS的::before偽元素做的(見本文件第三節C式核心邏輯)，
而html2canvas這套第三方截圖函式庫，對CSS ::before/::after偽元素的支援
本來就不穩定，常會畫錯位置、只畫出一部分、或整個漏畫，這正是使用者
看到「圈圈只剩半個、數字掉到圈圈外面」的根本原因——這不是座標算錯，
是html2canvas本身處理偽元素的已知限制。以前因為輸出圖很小(緊貼內容的
小圖)不容易注意到，現在拉伸滿版之後這個瑕疵被放大好幾倍，就變得很明顯。
修法：新增drawCModeMatchCirclesOntoCanvas()，仿照原本就有的
drawCircleMarksOntoCanvas()（幫「一二三四招」手動補畫圓圈）的做法，
把定位號碼、標定號碼這兩種cell也各自手動用canvas API重新畫一次圓圈
跟文字(不透過CSS ::before，直接用ctx.arc()畫圓、ctx.fillText()畫字)，
畫在html2canvas原本(可能有瑕疵)的渲染結果「上面」蓋過去，顏色沿用
markBgColorClick/markFrameColorClick這兩個已經算好的--mark-bg-color/
--mark-frame-color值，定位號碼跟標定號碼的填色/外框剛好互換
（呼應前面「標定號碼跟定位號碼配色互換」的既有設計），文字色統一用
--mark-text-color(綠)。

第一期(最上面那列)被截圖切掉的問題：saveAsImage()裡wasRecentOnlyMode
分支，重設panels.style.transform="none"、重新量測scrollerEl的自然尺寸
之後，才呼叫html2canvas(outer,...)去截圖；但如果使用者存檔前scrollerEl
本身還留有一段捲動位置(scrollTop不是0)，html2canvas只會截「目前捲動
位置往下看得到的範圍」，最上面第一列真實開獎資料就可能被捲出畫面外，
沒截到。修法：在這個分支一開頭、以及重新量完尺寸之後，各補一次
window.scrollTo(0,0)、scrollerEl.scrollTop=0、scrollerEl.scrollLeft=0，
確保html2canvas擷取時一定是從最頂端(第一列)開始，不受之前瀏覽時殘留的
捲動位置影響。

表格格線畫出格子外的問題：redrawAllGridLinesOntoCanvas()原本用
ctx.strokeRect(x,y,w,h)直接沿著格子的實際邊界畫線，但strokeRect畫出來
的線是「跨在邊界上」的(線寬一半在矩形內、一半在矩形外)，在自然尺寸的
小畫布上這一點點溢出不明顯，經過後面「拉伸滿版」的大倍率放大後，溢出
格外的那一半就變得很顯眼，看起來像線畫到格子外面去了。修法：仿照
drawMarkedFramesOntoCanvas()既有的內縮寫法，把x/y各往內縮
gridLineW/2、寬高各減去gridLineW，讓整條線完全畫在格子邊界「內側」，
不會有任何一部分溢出到格子外，這樣不管後面被拉伸幾倍，線都會乖乖貼在
格子邊緣內部。

C式截圖連線粗細再縮減為50%：OVERLAY_LINE_WIDTH算式末端再乘上.5，
即Math.max(.3,.9*naturalCellScale*.5)，取代原本的
Math.max(.3,.9*naturalCellScale)。

C式連線(定位/標定號碼連線、上下桿指標線)截圖裡「又粗又直、比例跟格子
大小不成比例」的問題：這幾條線的座標/粗細，是靠renderCModeArcLoop()
等函式透過requestAnimationFrame迴圈，讀取「當下」表格格子的
getBoundingClientRect()即時算出來的；但saveAsImage()把
panels.style.transform重設成"none"、把格子從「滿版拉伸」的大尺寸縮回
「自然」小尺寸後，這個rAF迴圈需要至少一次畫面更新週期才會重新算過、
換算出符合自然小尺寸的細線寬度——如果html2canvas剛好在rAF迴圈還沒來得
及重新計算之前就先讀走了SVG的屬性，drawFixedOverlaySvgsOntoCanvas()
讀到的就會是「格子還很大時」算出來的粗線寬度，套用到現在的小格子上
自然就顯得又粗又不成比例。
修法有兩層：
  1. saveAsImage()裡，在重設transform、量完自然尺寸的兩次
     requestAnimationFrame等待「之後」，如果cModeActive為true，額外
     手動同步呼叫一次markCModeAbRows()、runCurrentCSubModeSearch()、
     （「定」子模式的話再加renderCModeDingAutoDragDesignation()），
     強迫這些函式立刻用「現在」的自然尺寸重新算一次座標跟連線資料，
     不要仰賴rAF迴圈自己跑到，再多等兩幀讓畫面確實更新完成，才繼續
     往下執行html2canvas。
  2. drawFixedOverlaySvgsOntoCanvas()裡，不再讀取SVG元素本身的
     stroke-width屬性(容易讀到上述時間差造成的舊值)，改成統一用
     naturalCellScale直接現算一個粗細值(OVERLAY_LINE_WIDTH=
     Math.max(.3,.9*naturalCellScale))，四條線(c-mode-arc-svg、
     c-mode-ding-lines-svg、c-mode-ding-arcs-svg、
     c-mode-ding-auto-drag-lines-svg)一律套用同一個算法，不再對
     c-mode-arc-svg額外特別處理，確保不管SVG屬性當下是否來得及更新，
     畫出來的線寬永遠跟「現在」的自然格子尺寸成正比。

存檔完成後畫面左上角出現線殘影的問題：上面「修法1」提到，截圖前會
強制同步重算一次C式的連線資料，讓它符合「自然尺寸」的座標；但截圖完
呼叫restoreRecentOnlyZoom()把panels.style.transform改回「現場拉伸
滿螢幕」的樣子時，原本只是把transform改回去，沒有同步再強制重算一次
連線資料——line的SVG座標這時候還停留在「自然尺寸」算出來的位置，
沒有跟著transform一起變回「拉伸後」的正確位置，畫面上就會看到一截
線頭卡在左上角(因為自然尺寸下座標數值都偏小，換算到拉伸後的畫面座標
系統，自然就集中在左上角一小塊)，等rAF迴圈自己抓到變化重畫之前的
這段空檔，就是使用者看到的殘影。
修法：restoreRecentOnlyZoom()裡，把panels.style.transform改回現場的
拉伸值之後，如果cModeActive為true，比照截圖前的做法，用兩次
requestAnimationFrame等畫面轉場完成，再強制同步呼叫一次
markCModeAbRows()、runCurrentCSubModeSearch()（「定」子模式再加
renderCModeDingAutoDragDesignation()），把連線資料立刻依「現在拉伸後」
的座標重算一次，不用等rAF迴圈自然跑到，殘影就不會出現。

【後續修正-真正根源】上面內縮的修法套用後，使用者回報格線還是有畫出
格子外的情況(橫線右邊、縱線下面)。往回查才發現：每個td本身在CSS裡
就已經有border-right:1px solid #bbb、border-bottom:1px solid #bbb這組
「原生格線」(見table.road td的CSS規則)，html2canvas擷取畫面時本來就會
自然擷取到這組原生CSS格線；而redrawAllGridLinesOntoCanvas()是「額外」
在這組原生格線上面再疊一層手動畫的格線，兩層格線各自獨立計算座標，
沒有完全對齊，尤其在表格最外側邊緣(最右欄、最下面)，原生border的
collapse行為又跟一般格子不太一樣，兩層格線疊加、沒對齊，才會讓使用者
覺得「線畫出格子外」。最終修法：redrawAllGridLinesOntoCanvas()一開頭
加上if(wasRecentOnlyMode)return，讓定期十六/C式這條路徑完全跳過這個
手動疊加格線的函式，只保留html2canvas原生擷取到的CSS格線，不再有
兩層格線互相打架的問題。「一般存檔」（非wasRecentOnlyMode）維持原樣，
繼續用這個函式補強格線，不受影響（這是因為一般存檔的擷取脈絡跟
recentOnly不同，原本就仰賴這個函式補強，冒然一起拿掉可能會讓一般存檔
的格線消失或變淡，所以只針對recentOnly這條路徑跳過）。

浮水印「名揚四海」屬於既有設計，不是新增的錯誤：LOGO_WATERMARK_ENABLED
這個開關本來就是true，存檔時固定會在畫布的左上角、右上角各貼一次
logoWatermarkImg(這個App自己的品牌圖檔，畫面上顯示的是「名揚四海®」
字樣的圖片)，這是原始設計就有的品牌浮水印，不是這次修改截圖功能時
新增的東西。使用者確認「定期十六/C式截圖存檔」這條路徑不需要浮水印，
已經把wasRecentOnlyMode分支裡畫logoWatermarkImg那段if判斷整段拿掉，
只有這條路徑不再貼浮水印；「一般存檔」「儲存開獎單」(showSavePreview→
composePaperCanvas那條路徑)沒有動，仍然照原本設計貼浮水印。

16+4改成16+3、後來又改回16+4：使用者一度要求畫面只需要16期真實開獎
期數+3期空白期(共19列)，後來又要求恢復成原本的16期+4期空白(共20列)。
目前是恢復後的16+4，程式碼裡實際數值以上面「16+4設定」段落為準。

【後續修正-殘影】上面這個修法上線後，使用者回報出現「殘影」──每個
定位/標定號碼格子都疊了兩個圓圈(一個偏移、一個正常)。原因：
html2canvas雖然對::before偽元素支援不穩定，但並不是完全不畫，而是畫出
一個「有瑕疵、位置/大小不太準」的版本；我新增的
drawCModeMatchCirclesOntoCanvas()是疊加畫在html2canvas結果「上面」，
沒有先把html2canvas那個有瑕疵的原生版本蓋掉，變成兩個圓圈疊在一起、
互相錯位，就是使用者看到的殘影。修法：加CSS規則，讓
body.capturing-plain(saveAsImage()截圖時就會加在body上的class)生效時，
把.c-mode-auto-match-cell::before、.c-mode-cha-drag-designated::before
這兩個偽元素直接display:none，讓html2canvas擷取畫面時根本不會畫出原生
(有瑕疵)的圓圈，只留下後面用canvas API手動補畫的那個乾淨版本，不會再
有兩個圓圈疊加的殘影。這個class本來就只在截圖過程中短暫存在(擷取完會
在restoreRecentOnlyZoom()裡移除)，不影響畫面平常顯示。

上下桿紅線粗細再縮小到30%：naturalCellScale換算出來的粗細還是偏粗，
使用者確認後再乘上0.3，即strokeWidthPx=原始值×naturalCellScale×0.3。

日期文字色：C式/定期十六固定用 #BF9400（拖曳七號，寫死不受調色盤影響，
避免使用者把拖曳色調很淺時日期看不到）

空白期(未開獎)月初第一期日期格式沒有被精簡的問題：compactDayCellsForPeriod16()
負責把月初第一期原本的「月/日」格式(如"9/1")簡化成只顯示「日」(如"1")，
但這個函式原本只在剛按下「定期十六/C式概率/C式定位」那個當下呼叫一次
(period16Btn/broadBtn/distProbBtn的click handler裡)。如果之後空白期數
設定有變動(例如cModeRecentBlankExtra從3改回4，多顯示了一列空白期)，
applyRecentOnly()重新計算哪些列該顯示時，並不會再呼叫一次
compactDayCellsForPeriod16()，如果新多顯示出來的那一列剛好是月初第一期，
就會維持在還沒精簡過的原始「月/日」格式，字體也會是fom專用的小字級，
看起來像是「日不見了」(其實是整個「月/日」擠在一起，字很小不容易辨識)。
修法：在applyRecentOnly()重新計算完列的顯示/隱藏、版面settle之後，
順便多呼叫一次compactDayCellsForPeriod16()，確保不管空白期列是在哪個
時機點被顯示出來，只要畫面上看得到的月初第一期格子，格式都會被正確
精簡，不會停留在原始格式。

月初第一期日期字級太小的問題：CSS裡.fom這個class本身有額外的
font-size:6.48px(比一般日期的font-size:7.8px更小)，還疊了好幾層
scale(0.48)/scale(0.432)這類縮放transform，這是原本設計用來把
「月/日」兩段式格式(如"9/1")硬塞進小小的日期欄位用的。但
compactDayCellsForPeriod16()把文字簡化成只顯示「日」(如"1")之後，
這些縮小用的CSS樣式沒有跟著拿掉，導致簡化後的單一數字看起來比其他
一般日期小了一大截。
修法：compactDayCellsForPeriod16()處理完月初第一期格子的文字簡化後，
額外把td的first-of-month、span的fom這兩個class都拿掉(只留下span的
cell-shift)，讓這個格子完全比照一般日期格子的CSS規則走(不再套用.fom
那些縮小規則)，字級就會自動跟其他日期一致，不需要手動去猜、去對一般
日期實際用的font-size/transform數值是多少。

月初日期置中：兩處都改用「width:100%+text-align:center」取代原本的
inline-block自動寬度置中，因為自動寬度置中在文字長度不同時(如"1/17"比"9/1"長)
會有次像素置中誤差(愈長誤差愈大)，改用撐滿寬度的方式後可以把誤差降到接近0

【五、調色盤系統（個性調色）】
五個顏色變數，CSS variable設在:root，使用者可在「個性調色」面板調整，
存在localStorage(539_palette_前綴)：
  --mark-frame-color 框色 預設#EE4444 (紅階 PALETTE_RED)
  --mark-bg-color    底色 預設#3B82F6 (藍階 PALETTE_BLUE)
  --mark-text-color  字色 預設#2ECC71 (綠階 PALETTE_GREEN)
  --mark-line-color  線色 預設#999999 (灰階 PALETTE_GRAY)
  --mark-predict-color 拖曳 預設#BF9400 (黃階 PALETTE_YELLOW，UI標籤原叫「預測」
                        已改名「拖曳」，但CSS變數名稱本身沒改，容易搞混要注意)

固定不隨調色盤變動的顏色（刻意寫死，避免使用者調色盤設定影響到不該受影響的地方）：
  - 錨定列文字：#1F1F1F（線色9號）
  - C式/定期十六日期文字：#BF9400（拖曳7號）
  - 第四招選號文字：#5E0E0E（框色9號）
  - 拖曳桿鍵圖示：#FFD700（金色，SVG stroke）

【六、除錯工具（瓢蟲🐞）】
左下角瓢蟲圖示：
  - 短按：downloadBugLogCapture(10000)，下載最近10秒事件記錄成txt檔，
    內容包含：系統狀態快照、上下桿錨定列每格的實際HTML/class（
    這段對排查「畫面顯示了什麼」類型的問題非常有用，比截圖更精確）
  - 長按：showBugLogViewer()，跳出完整歷史記錄檢視器
  - 螢幕截圖功能已移除（曾經加過html2canvas自動截圖，因為縮放疊加渲染
    效果不佳、且有裁切留白問題，使用者要求拿掉，目前只留文字記錄）
  - 三指連續點兩下也能開啟完整記錄檢視器

【七、資料庫與雲端同步】
localStorage前綴 539app_db_ + 玩法key，四個玩法各自存一份
IndexedDB也有一份備份(loadLotteryLocalDBIntoEmbedded等函式)
雲端來源：539-backend-production.up.railway.app、
         hearty-vitality-production-0687.up.railway.app
（2026-08-27 使用者確認這兩個Railway後端已棄用不再使用，程式已移除所有對外
  發送的網路請求：loadData()/refresh-btn 不再打539-backend，
  fetchSingleGameCloudLatest()改成直接回傳「沒有更新」不再打hearty-vitality，
  每60秒的排程檢查(runScheduledCloudChecks的setInterval)也已移除。
  checkCloudUpdates()/manualUpdateAndMergeData()/runScheduledCloudChecks()
  這幾個函式本體還留著沒刪，但因為呼叫的fetchSingleGameCloudLatest已經是
  no-op，實際上不會再發出任何網路請求，純粹是安全起見不去動周邊呼叫它們的
  程式碼結構）
資料更新目前完全依賴使用者手動輸入(manual-entry-btn)

【八、已知限制】
- Claude沙盒環境無法連線測試539-backend/hearty-vitality這兩個自訂後端
  （2026-08-27起已不需要，這兩個後端已棄用）

================================================================================

<script>/*
================================================================================
程式技術文件 / 開發紀錄（嵌入於程式碼內，方便日後維護查閱）
最後更新：2026-08-21
================================================================================

【一、四招標記系統】
這是「抓牌」畫面裡核心的號碼標記功能，共四種操作方式：
  第一招：雙擊已開獎的號碼格 → 紅底綠框圓形標記
    - 觸發：panels 的 dblclick 監聽器 → pickCell(td)
    - 資料存放：pickedPaths 陣列，每筆 { via:"click", ... }
  第二招：手指滑過整排號碼（橫向滑動）→ 矩形外框標記
    - 觸發：panels 的 pointerdown/pointermove → markCellForDrag(td) / unmarkCellForDrag(td)
    - 資料存放：pickedPaths 陣列，每筆 { via:"drag", ... }
  第三招：拖曳已標記的格子之間 → 自動算出藍色連接線
    - 觸發：panels 的另一組 pointerdown（需要 viewPinned 為 true）
    - 資料存放：connections 陣列
  第四招：長按未開獎的空白格 → 跳出選號盤，選完在格子右上角顯示累加數字
    - 觸發：panels 的長按 pointerdown → openNumPicker(td)
    - 資料存放：numPickedEntries 陣列

  ⚠️ 已知架構限制：四招的顯示都是透過 applyMarksToClone() 統一「清空重繪」，
  任何新功能如果要疊加標記樣式，務必透過 pickedPaths 登記，
  不要直接對 td 加 num-marked / num-marked-drag / num-marked-click 這三個 class，
  否則會被 applyMarksToClone() 的清空機制打架、互相覆蓋。

  四招的啟用總開關是 body 的 "magnifier-mode" class，只有在 activatePeriodMode()
  （定期十六/E式/C式）或抓牌首頁的 activateFloatingButtons()/showFullPageImage()
  正確加上這個 class 之後，四招的判斷式才會生效。這是原始版本就存在、後來修復的坑，
  詳見下方【七、修復紀錄】。

【二、定期十六 / E式 / C式 的關係】
  三者共用同一個進入函式 togglePeriodMode() → activatePeriodMode()：
  - 定期十六（period16Btn）：純粹放大顯示最近 16~21 期
  - E式（clearBtn，即「E式概率」按鈕）：目前程式碼上跟定期十六完全一樣，
    沒有獨立的 E 式運算邏輯，只是另一個標籤/入口
  - C式（broadBtn）：在 togglePeriodMode() 之外，額外呼叫 applyCModeAutoFraming()
    疊加一層「定/差/合」分析（cModeActive = true）

  C 式啟用時（cModeActive = true）：
  - 一二三四招全部鎖住（pickCell / markCellForDrag / unmarkCellForDrag /
    長按 pointerdown / dblclick 的 num-picked 分支，都加了 if(cModeActive)return; 判斷）
  - 進入 C 式：resetAllFourMoveMarks() 清空之前定期十六階段留下的四招痕跡
  - 離開 C 式：forceExitCModeIfActive() 統一處理解鎖 + 清空，唯一入口，
    被 togglePeriodMode 的退出分支、closeBtn 的點擊、以及 activateFloatingButtons()/
    showFullPageImage() 這兩個進入點共同呼叫，確保任何路徑離開都會正確解鎖

【三、統計表（長按「定」／長按「差」）】
  兩者用完全相同的九宮拖牌演算法（見 calcNineGridDrag），
  抓上桿(A)/下桿(B)往前推 cModeDingSearchSpan / cModeChaSearchSpan 期，
  比對候選格子跟 B 錨點列號碼的九宮拖牌關係，命中就計數。

  唯一差別在於「要不要先篩選格子的標記狀態」：
  - 長按「定」→ computeCModeDingStatCounts()：排除已標記的格子，
    只對「完全沒被標記」的候選格子做運算
  - 長按「差」→ computeCModeChaStatCounts()：只對「已經被標記」的格子做運算
  判斷「有沒有被標記」統一用 pickedPaths 陣列查詢（AB 上下桿標記、
  定/差/合各自的比對命中，都會登記進 pickedPaths）。

  統計表 UI：0-9 顏色數字表（顏色數字表變數，淺灰#E5E5E5 → 深紅#7A0000 共9階），
  數字出現次數越高顏色越深，最高分會綠色閃爍（pinBlink 動畫）。
  兩張統計表互斥：開一張會自動關閉另一張。
  拖曳上/下桿時，兩張表都會即時歸零/重新計算（resetCModeXxxStatDisplay / refreshCModeXxxStatDisplay）。

【四、瓢蟲除錯系統】
  左下角固定顯示的 🐞 按鈕（id="bug-log-fab"）：
  - 輕點：擷取「按下當下往前推 5 秒內」的所有事件記錄，存成 .txt 檔案下載
  - 長按（約0.5秒）：打開完整記錄檢視器（可捲動、複製全部、清空）
  全域函式 logEvent(tag, detail) 會把事件寫入記憶體陣列 bugLog（最多留1500筆），
  同時每0.5秒同步一份到 localStorage（key: 539app_bugLog），
  window.onerror / unhandledrejection 也會自動記錄 JS 錯誤堆疊。

  瓢蟲在畫面上的位置由 positionPinOnScreen() 動態決定，共有四種【各自獨立】的排列分支：
  1. C 式啟用中：定/差/🐞/合/期，5顆按鍵，瓢蟲在正中間
  2. 定期十六／E式（非 C 式）：同樣5顆排列，但獨立判斷（看 recentOnly），不跟 C 式共用邏輯
  3. 抓牌首頁（進入定期十六前的九宮格過場）：同樣5顆排列，獨立判斷 img-overlay 的 open class
  4. 一般首頁：瓢蟲固定在左下角(6px, 6px)

【五、資料讀取／存檔機制】
  - 存檔：手動輸入、雲端同步新增開獎記錄時，只會寫入 localStorage
    （saveDbToLocalStorage）跟 IndexedDB（saveDrawRecordToDB），
    不會再觸發任何檔案下載（exportLotteryDatabaseAsFile 已整個移除）。
  - 讀取：App 開機時，boot() 一開始就先 await loadLotteryLocalDBIntoEmbedded()，
    確保 localStorage/IndexedDB 的資料在畫面第一次渲染之前就已經套用完成，
    避免「先顯示舊資料、才跳成新資料」的閃爍。
    此函式內部會兩邊都讀（先套用 localStorage，再套用 IndexedDB），
    用時間戳記（_savedAt）比對新舊，永遠留下最新的一筆，
    避免任何一邊資料比較新卻被忽略的情況。
  - 雲端同步：（2026-08-27 已棄用並移除）原本 manualUpdateAndMergeData()
    （開機執行）+ runScheduledCloudChecks()（每60秒排程檢查，涵蓋539/天天樂/
    六合彩/大樂透四種玩法在特定時段自動抓取）會呼叫外部雲端服務
    （hearty-vitality-production-0687.up.railway.app）。使用者確認該後端
    已棄用不再使用，fetchSingleGameCloudLatest() 已改成直接回傳「沒有更新」、
    不再對外發送任何網路請求，setInterval 排程本身也已移除。
    manualUpdateAndMergeData()/checkCloudUpdates()/runScheduledCloudChecks()
    這幾個函式本體還留著沒刪，但因為呼叫的 fetchSingleGameCloudLatest 已經是
    no-op，實際上形同停用，純粹是安全起見不去動周邊呼叫它們的程式碼結構。
    資料更新目前完全依賴使用者手動輸入（manual-entry-btn）。

【六、截圖／存檔／印單機制】
  這是把畫面上的開獎單/標記結果匯出成圖片檔的功能，跟【五】的本機資料庫存檔是完全不同的兩件事：
  - saveAsImage()：對應「存」按鈕（floatSaveBtn 一般模式下雙擊、或 saveBtn），
    用 html2canvas 擷取 scrollerEl（整個表格區域），輸出成 PNG 下載
  - saveCleanSheetImage()：對應首頁的「印」按鈕（cleanSheetBtn）雙擊，
    產生給列印用的乾淨版面，並依「尺寸」鍵(sheetSizeBtn，雙擊開選單)設定的
    紙張A3/A4與開獎單字體直接存檔(saveSheetDirectly)，2026-08-31起不再有存檔預覽視窗
  - 兩者都共用 html2canvas 這個第三方函式庫。注意：它其實是整包內嵌在本檔案
    第一個 <script> 區塊裡（約 198KB），並不是動態下載；ensureHtml2Canvas()
    只是回傳「全域 html2canvas 是否存在」的一個 Promise，沒有真的去載入任何東西。
  - 擷取過程會顯示一個全螢幕的「處理中…」遮罩（#capture-mask），沒有預覽步驟，
    處理完直接觸發瀏覽器下載

  ⚠️ 設計決策（重要）：C 式的覆蓋元素（紅色參考弧線、拖曳把手等）刻意設計成
  跟這兩個存檔函式「完全脫鉤」——saveAsImage()/saveCleanSheetImage() 裡沒有任何
  一行程式碼認識或處理 C 式的存在。原因是 C 式啟用時，一二三四招以及原本的
  存/印按鈕都已經被鎖住/替換成「定/差/合」，使用者操作上根本無法在 C 式畫面
  觸發這兩個存檔函式，所以不需要、也不應該讓存檔功能反過來認識 C 式的內部狀態。
  C 式覆蓋元素自己有 MutationObserver 監看 recent-only-mode class 自動清理
  （clearCModeOverlay()），這才是正確的清理責任歸屬。
  （這個決策的完整討論過程，包含中間一度加過、又刪除的 html2canvas 修補程式碼，
  詳見對話紀錄，這裡只記錄最終定案的架構原則。）

【七、修復紀錄（本次對話中修正的 bug）】
  1. 統計表打開時，標定號碼背景/圓形標記、差合連線弧線、上下桿紅色參考弧線
     被 CSS 強制隱藏 → 已移除 body.c-mode-stat-open 相關的隱藏規則
  2. 統計表打開時，renderCModeArcLoop() 內部另外寫死的判斷式會清空紅色參考弧線
     → 已移除該判斷式，弧線跟連線可同時顯示
  3. 抓牌/存檔功能使用 html2canvas 擷取整頁時，C 式的 position:fixed 覆蓋元素
     （紅色弧線、拖曳把手）會被錯誤拉伸到超長截圖上 → 最終方案是從源頭修正
     C 式自身的清理機制，不讓存檔功能認識/耦合 C 式
  4. 「一二三四招」在定期十六裡完全沒反應 → 根本原因是原始檔案從頭到尾都沒有
     任何程式碼會把 body.magnifier-mode 這個總開關 class 加上去（只有 remove，沒有 add），
     已在 activatePeriodMode() 加上遺漏的 document.body.classList.add("magnifier-mode")
  5. C 式的覆蓋元素在離開後可能沒有正確解鎖 cModeActive，導致定期十六裡的
     第二招被誤鎖 → 新增 forceExitCModeIfActive() 統一處理，多個進入/退出路徑
     都會呼叫這個函式確保狀態一致
  6. 手動輸入開獎號碼後會自動觸發 JSON 資料庫下載通知 → exportLotteryDatabaseAsFile()
     整個函式已移除，改為只寫入 localStorage/IndexedDB
  7. 開機讀取本機資料庫的順序調整為「先套用 localStorage，再套用 IndexedDB，
     用時間戳比新舊」，並把資料載入時機提前到畫面渲染之前

【八、效能／記憶體優化紀錄（2026-08-21）】
  背景：使用者回報手機上「經常無法讀取網頁」（Chrome renderer 被系統強制關閉）。
  這次用無頭 Chromium 實測後確認：不是慢性記憶體洩漏，而是存檔當下的瞬間爆量。

  ● 實測基準（412x915 手機視窗、A3 輸出）
    重複呼叫 buildPanels() 40 次、切換玩法 20 次、visibilitychange 30 次之後，
    JS heap / DOM 節點數 / 事件監聽器數量都沒有成長 → 排除 detached DOM 累積。
    但按一次「存」或「印」，畫布記憶體會瞬間衝到 136MB 而且不會馬上釋放；
    若「存」和「印」時間接近而重疊，峰值可達 272MB —— 手機 renderer 會直接被砍。

  1. 存檔流程移除多餘的全尺寸中繼畫布
     原本：html2canvas 產出 rawCanvas → 再建一張同尺寸(+留白)的 canvas 複製過去
     → 在上面補畫文字 → 再縮放進 A3 紙張畫布。三張大圖同時存在。
     現在：直接在 html2canvas 回傳的畫布上補畫文字，留白改成縮放進紙張時才內縮，
     視覺結果一樣（實測只有最外框線位移不到 1px，內容像素完全相同）。

     ⚠️ 這裡有個很容易踩的坑：html2canvas 回傳的畫布，它的 2D context 內部

     實測結果：單次存檔瞬時峰值 136.3MB → 100.5MB；
     存完之後仍佔用 136.3MB → 0MB；兩個存檔同時觸發 272.5MB → 100.5MB。

【九、首頁縮放／版面修復紀錄（2026-08-27）】
  背景：使用者回報一系列「首頁開獎單放大後跑版」的問題，逐一排查後發現
  都跟 pageZoom（雙指縮放）、panels.style.zoom（表格自身縮放）這兩層縮放
  互相干擾有關，共修正 8 個項目：

  1. 退出定期十六／C式／E式時，panels.style.zoom 被錯誤蓋成 MAGNIFIER_ZOOM
     (0.600802) 而不是重設回 CSS 預設值 0.59 → togglePeriodMode() 的退出分支
     刪掉多餘的 panels.style.zoom=MAGNIFIER_ZOOM 這行，讓 applyRecentOnly()
     的正確重設生效。

  2. 雙指放大後往上滑會卡住、看不到最上面幾期 → 原本的捲動下限
     (minScrollY) 是用「反推出來的 padding 值 × 縮放倍率」估算，縮放倍率
     越大估算誤差越大。改成即時量測 .scroller 實際螢幕位置反推目標捲動值
     （blockNativePinchZoomInMagnifier() 的 scroll 監聽、setupPageZoom() 的
     touchmove 監聽，兩處都改）。這個算法是數學不變量：不管當下捲到哪，
     算出來的目標值都一樣，不會再受縮放倍率影響累積誤差。

  3. 若瀏覽器把手機判定成「≥900px 桌面寬度」（例如開了「電腦版網站」），
     applyDesktopScrollerWidth() 會把開獎單縮到接近內容本身寬度、但沒有
     置中，永遠貼左、右側留白 → 幫 headerTopEl／heroEl／scrollerEl 加上
     marginLeft/marginRight:"auto"。

  4. 一般手機（非桌面判定）只要螢幕 CSS 寬度超過約 403px（.panels 表格
     本身的自然寬度是固定的、不會隨螢幕變寬），.scroller 容器會撐滿螢幕
     但 .panels 內容撐不滿，右側留白，且螢幕越寬留白越明顯 →
     applyDesktopScrollerWidth() 新增「非桌面分支」：量出 .scroller 實際
     可用寬度後，把 panels.style.zoom 往上調到剛好填滿（只放大填滿，
     不縮小硬塞，窄螢幕不受影響）。

  5. 上述兩個版面調整動作，原本都用 requestAnimationFrame 把「量測後
     設定最終大小」延到下一幀才做，中間會先畫出一次「錯誤/未調整前」
     的畫面，造成「先顯示小尺寸、再跳到正確大小」的閃爍 → 桌面/非桌面
     兩個分支都改成完全同步計算，不再等下一幀；另外 applyRecentOnly()
     進入定期十六/C式/E式時的縮放計算，改成先把 panels/scrollerEl設成
     visibility:hidden，算完最終縮放跟定位後才顯示，避免看到中間放大
     過程的跳動。

  6. 首頁開獎單處在放大狀態時切換 539/六合彩/天天樂/大樂透分頁，新分頁
     會直接沿用舊的 pageZoom 去建版面，畫面整個跑版（分頁按鈕、紅框都
     被壓縮貼左）→ setupGameTabs() 的點擊事件最前面，立刻呼叫
     window.__resetPinchState()、把 pageZoom 強制重設回 1 並套用、捲動
     回頂端，確保切換分頁後一定是乾淨、正常大小的畫面。

  7. 月初第一期的日期字串（例如「8/1」「2/2」，class="fom"）沒有真正
     置中，固定偏左一點點 → 根本原因是原本用
     transform:translate(-50%) scale(0.48) 同時做「置中」跟「縮小」：
     CSS 規定 translate 的百分比是用縮放前的元素尺寸去算，但套用到的是
     縮放後看起來變小的文字框，兩者對不上，就會產生固定的系統性偏移

     改成不用 scale()，直接把 font-size 設成縮小後的實際數值
     （13.5px × 0.48 ≈ 6.48px），純用 text-align:center 置中，
     沒有縮放變形，數學上不會再有偏移。

  （360～1080px）實際模擬、量測像素數值後才確認修復，不是憑肉眼猜測；
  第7項也用同樣方式量出置中前後的左右像素差，確認偏移消除。

【十、GitHub 雲端同步機制修復紀錄（2026-08-27）】
  背景：使用者發現「GitHub 上明明已經更新到8/25、8/26，App 卻一直停在很舊的
  資料」，查下去發現 syncCrawlerDataFromGithub() 其實從未成功同步過任何一種
  玩法的完整資料，共有 3 個獨立問題：

  1. 日期格式解析失敗：normalizeCrawlerDate() 的 ISO 日期正規表示式只接受
     純日期"2026-08-26"，但 GitHub 上「今彩539」「大樂透」的 draw_date 欄位
     其實帶了時間戳，是"2026-08-26T00:00:00"格式，一有後面的T就直接解析
     失敗回傳null，導致這兩種玩法的每一筆資料在來源端就被整批跳過。
     → 正規表示式改成 /^(\d{4})-(\d{1,2})-(\d{1,2})(?:T.*)?$/，允許可有可無
     的T後綴。

  2. 【最關鍵】作用域錯誤導致同步「處理完第一筆新資料就當機」：
     manualUpsertDrawRecord() 內部呼叫的 purgeStaleNumPickedEntriesForDate()
     是一個頂層函式，但它直接讀寫 numPickedEntries / numPickedEntriesCDing /
     numPickedEntriesCCha / numPickedEntriesCHe 這幾個變數——這些變數其實是
     宣告在 setupImageView() 閉包內部的區域變數，只有閉包內的程式碼摸得到。
     從閉包外面（例如 GitHub 同步、開機時的 loadData 等頂層流程）呼叫
     manualUpsertDrawRecord 時，一路呼叫到 purgeStaleNumPickedEntriesForDate
     就會丟出 ReferenceError，把整個 syncCrawlerDataFromGithub() 的
     try/catch 整段中斷。因為 toApply 是用 .reverse() 從舊到新依序套用，
     所以每次同步實際上「只會成功套用最舊的那一筆新資料，套用第二筆時就
     當掉」，也因此 App 資料才會一直停滯不前，即使 GitHub 上已經有很多筆
     新資料。這是一個相當隱蔽的 bug：因為每次同步「至少會成功一筆」，
     表面上看起來像是「有在動，只是比較慢」，實際上完全卡住。
     → 修法：在 setupImageView() 閉包內（真正摸得到那幾個變數的地方），
     新增 window.__purgeStaleNumPickedInMemory(dateStr) 把清理邏輯包起來
     暴露出去，同時也暴露 window.__loadNumPickedFromStorage /
     window.__saveNumPickedToStorageRaw 這兩個原本也是閉包內部、外部呼叫
     不到的輔助函式。頂層的 purgeStaleNumPickedEntriesForDate() 改成呼叫
     這幾個 window.__ 開頭的暴露函式，不再直接觸碰閉包內部變數。

ME,LOTTERY_DB_VERSION);req.onupgradeneeded=function(e){const db=e.target.result;Object.values(LOTTERY_DB_STORES).forEach(function(storeName){if(!db.objectStoreNames.contains(storeName)){db.createObjectStore(storeName,{keyPath:"date"})}});if(!db.objectStoreNames.contains(SETTINGS_STORE_NAME)){db.createObjectStore(SETTINGS_STORE_NAME,{keyPath:"key"})}};req.onsuccess=function(e){lotteryDBInstance=e.target.result;resolve(lotteryDBInstance)};/* 2026-08-30：另一個分頁還開著舊版本的資料庫時open會被blocked，原本永遠不會resolve→開機卡在「讀本機資料庫」。加onblocked與8秒逾時直接reject，讓開機流程繼續(改用localStorage/內嵌資料) */req.onblocked=function(){reject(new Error("IndexedDB被其他分頁擋住(blocked)，請關閉其他開著本程式的分頁"))};setTimeout(function(){reject(new Error("IndexedDB開啟逾時"))},8000);req.onerror=function(e){reject(e.target.error)}})}function saveSettingToLS(key,value){try{localStorage.setItem("539app_setting_"+key,JSON.stringify(value));return true}catch(e){console.warn("寫入設定到localStorage失敗（不影響App主要功能）：",key,e);return false}}function loadSettingFromLS(key,fallback){try{const raw=localStorage.getItem("539app_setting_"+key);if(raw===null||raw===undefined)return fallback;return JSON.parse(raw)}catch(e){return fallback}}async function saveSettingToDB(key,value){try{const db=await openLotteryDB();return await new Promise(function(resolve){const tx=db.transaction(SETTINGS_STORE_NAME,"readwrite");tx.objectStore(SETTINGS_STORE_NAME).put({key:key,value:value});tx.oncomplete=function(){resolve(true)};tx.onerror=function(){resolve(false)}})}catch(e){return false}}async function loadSettingFromDB(key){try{const db=await openLotteryDB();return await new Promise(function(resolve){const tx=db.transaction(SETTINGS_STORE_NAME,"readonly");const req=tx.objectStore(SETTINGS_STORE_NAME).get(key);req.onsuccess=function(){resolve(req.result?req.result.value:undefined)};req.onerror=function(){resolve(undefined)}})}catch(e){return undefined}}function saveSetting(key,value){saveSettingToLS(key,value);saveSettingToDB(key,value).catch(function(e){console.warn("寫入設定到IndexedDB失敗（不影響App主要功能，LS那份還在）：",key,e)})}async function reconcileSettingFromDB(key,fallback){const lsValue=loadSettingFromLS(key,undefined);if(lsValue!==undefined)return lsValue;const dbValue=await loadSettingFromDB(key);if(dbValue!==undefined){saveSettingToLS(key,dbValue);return dbValue}return fallback}async function saveDrawRecordToDB(gameKey,record){const storeName=LOTTERY_DB_STORES[gameKey];if(!storeName)return;try{const db=await openLotteryDB();await new Promise(function(resolve,reject){const tx=db.transaction(storeName,"readwrite");tx.objectStore(storeName).put(record);tx.oncomplete=resolve;tx.onerror=function(e){reject(e.target.error)}});if(typeof logEvent==="function")logEvent("存檔(IDB)","成功寫入 "+gameKey+" 日期="+record.date)}catch(e){console.warn("寫入本機資料庫失敗（不影響App主要功能）：",gameKey,e);if(typeof logEvent==="function")logEvent("存檔(IDB)失敗","寫入 "+gameKey+" 日期="+record.date+" 時發生錯誤: "+(e&&e.message?e.message:e))}}async function loadLotteryLocalDBIntoEmbedded(){const gameDataMap={539:EMBEDDED_DATA,daily:EMBEDDED_DAILY_DATA,mark6:EMBEDDED_MARK6_DATA,lotto:EMBEDDED_LOTTO_DATA};/* 效能：原本每筆都用findIndex線性掃描整個陣列(O(n²))，539有數千筆、開機要跑兩遍(LS+IndexedDB)、

const mergeIndexCache=new Map();const mergeDirtyArrays=new Set();

function normalizeCrawlerDate(raw,fallbackCheckedAt){
  const MONTH_MAP={JAN:1,FEB:2,MAR:3,APR:4,MAY:5,JUN:6,JUL:7,AUG:8,SEP:9,OCT:10,NOV:11,DEC:12};
  if(typeof raw==="string"){
    const s=raw.trim();
    let m;
    m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})(?:T.*)?$/);
    if(m)return m[1]+"-"+String(m[2]).padStart(2,"0")+"-"+String(m[3]).padStart(2,"0");
    m=s.match(/^(\d{4})\/(\d{1,2})\/(\d{1,2})$/);
    if(m)return m[1]+"-"+String(m[2]).padStart(2,"0")+"-"+String(m[3]).padStart(2,"0");
    m=s.match(/^(\d{4})年(\d{1,2})月(\d{1,2})日$/);
    if(m)return m[1]+"-"+String(m[2]).padStart(2,"0")+"-"+String(m[3]).padStart(2,"0");
    m=s.match(/^(\d{2,3})年(\d{1,2})月(\d{1,2})日$/);
    if(m){const y=parseInt(m[1],10)+1911;return y+"-"+String(m[2]).padStart(2,"0")+"-"+String(m[3]).padStart(2,"0")}
    m=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
    if(m)return m[3]+"-"+String(m[1]).padStart(2,"0")+"-"+String(m[2]).padStart(2,"0");
    m=s.match(/^[A-Za-z]{3}\/([A-Za-z]{3})\s+(\d{1,2}),\s*(\d{4})$/);
    if(m){const mo=MONTH_MAP[m[1].toUpperCase()];if(mo)return m[3]+"-"+String(mo).padStart(2,"0")+"-"+String(m[2]).padStart(2,"0")}
  }
  if(typeof fallbackCheckedAt==="string"){
    const m2=fallbackCheckedAt.match(/^(\d{4}-\d{2}-\d{2})/);
    if(m2)return m2[1]
  }
  return null
}
async function syncCrawlerDataFromGithub(){

    const res=await Promise.race([fetchPromise,timeoutPromise]);
    if(!res.ok)return;
    const json=await res.json();
    const gameDataMap={
      539:data539Cache&&Array.isArray(data539Cache)?data539Cache:EMBEDDED_DATA,
      daily:EMBEDDED_DAILY_DATA,
      mark6:EMBEDDED_MARK6_DATA,
      lotto:EMBEDDED_LOTTO_DATA
    };
    const updatesFound=[];
    Object.keys(CRAWLER_GAME_NAME_MAP).forEach(function(crawlerName){
      const gameKey=CRAWLER_GAME_NAME_MAP[crawlerName];
      const crawlerRecords=json[crawlerName];
      if(!Array.isArray(crawlerRecords)||crawlerRecords.length===0)return;
      const localArr=gameDataMap[gameKey]||[];
      const localLatest=localArr.length?localArr[localArr.length-1]:null;
      const localLatestDate=localLatest?localLatest.date:"";
      const toApply=[];
      for(let i=0;i<crawlerRecords.length;i++){
        const rec=crawlerRecords[i];
        const dateStr=normalizeCrawlerDate(rec.draw_date,rec.checked_at);
        if(!dateStr)continue;
        if(dateStr<localLatestDate)break;
        const numbers=(rec.numbers||"").trim().split(/\s+/).map(function(s){return parseInt(s,10)}).filter(function(n){return!isNaN(n)});
        if(numbers.length===0)continue;
        const specialParsed=rec.special_number&&String(rec.special_number).trim()?parseInt(rec.special_number,10):NaN;
        if(dateStr===localLatestDate&&localLatest){
          const localNumsStr=localLatest.numbers.map(function(n){return String(n).padStart(2,"0")}).join(" ");
          const crawlerNumsStr=numbers.slice().sort(function(a,b){return a-b}).map(function(n){return String(n).padStart(2,"0")}).join(" ");
          if(localNumsStr===crawlerNumsStr)continue
        }
        toApply.push({date:dateStr,numbers:numbers,special:specialParsed})
      }
      if(toApply.length>0){
        /* toApply 是「新到舊」排序，第0筆就是這次同步到的最新日期，
           要在 .reverse() 破壞順序之前先記下來，用來顯示提示 banner */
        updatesFound.push({label:GAME_LABELS[gameKey]||gameKey,cloudDate:toApply[0].date,localDate:localLatestDate||"（本機尚無資料）"})
      }
      toApply.reverse().forEach(function(item){
        manualUpsertDrawRecord(gameKey,item.date,item.numbers,item.special)
      })
    })
    if(updatesFound.length>0){
      if(typeof logEvent==="function")logEvent("GitHub同步","偵測到更新："+updatesFound.map(function(u){return u.label+" "+u.localDate+"→"+u.cloudDate}).join("、"));

    }
  }catch(e){
    console.warn("同步爬蟲資料失敗（不影響App主要功能）：",e)
  }
}
